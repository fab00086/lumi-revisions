e">Vidéo d’illustration de Lumi. Pour ouvrir un accès famille, faites la demande dans l’application.</p></main><script>document.getElementById('share-video').addEventListener('click',async()=>{const status=document.getElementById('status');try{const url=location.href;if(navigator.share){await navigator.share({title:'Découvrez Lumi',text:'Lumi en 30 secondes : un compagnon pour comprendre les devoirs.',url});}else{await navigator.clipboard.writeText(url);status.textContent='Lien de la vidéo copié.';}}catch(error){if(error.name!=='AbortError')status.textContent='Copiez l’adresse de cette page pour partager la vidéo.';}});</script></body></html>
