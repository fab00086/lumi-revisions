services:
  - type: web
    name: lumi-revisions
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false   # a remplir dans le tableau de bord Render
      - key: OLLAMA_MODEL
        value: glm-5.3-flash:cloud
      - key: OLLAMA_VISION_MODEL
        value: gemma4:31b
      - key: LUMI_ACCESS_CODE
        sync: false   # choisi par la famille (ex : LUMI-FAMILLE-2026)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NO_HTTPS
        value: "1"
      - key: NO_OPEN_BROWSER
        value: "1"
